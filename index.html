<style>
:root{
  --bg:#EFF1EE; --surface:#FFFFFF; --ink:#17282A; --muted:#5F7275;
  --rule:#D3DBD8; --accent:#0D5B52;
  --ok:#14634B; --okbg:#DDEDE4; --no:#96382C; --nobg:#F5E1DC;
  --shade:#E4E8E4;
  --c-doc:#2F6F8F; --c-test:#B5651D; --c-int:#8E3B8E; --c-ann:#6B7A7C; --c-per:#3D7A3A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1618; --surface:#162124; --ink:#E4EDEA; --muted:#8FA5A3;
    --rule:#253538; --accent:#58BBA4;
    --ok:#58BBA4; --okbg:#14312B; --no:#E28C7A; --nobg:#35201C; --shade:#1C282B;
    --c-doc:#6FB3D6; --c-test:#E0A262; --c-int:#CF8ACF; --c-ann:#9AABA9; --c-per:#86C783;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162124; --ink:#E4EDEA; --muted:#8FA5A3;
  --rule:#253538; --accent:#58BBA4;
  --ok:#58BBA4; --okbg:#14312B; --no:#E28C7A; --nobg:#35201C; --shade:#1C282B;
  --c-doc:#6FB3D6; --c-test:#E0A262; --c-int:#CF8ACF; --c-ann:#9AABA9; --c-per:#86C783;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
#shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
#scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%;
}
.wrap{max-width:620px;margin:0 auto;padding:0 20px 40px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.masthead{padding:44px 0 6px}
.masthead h1{font-family:"Gowun Batang",serif;font-size:30px;font-weight:700;margin:0}
.masthead p{font-size:13px;color:var(--muted);margin:8px 0 0}

.hero{padding:44px 0 32px}
.hero .when{font-size:13px;color:var(--muted)}
.hero .num{font-family:"Gowun Batang",serif;font-size:96px;line-height:.92;font-weight:700;
  font-variant-numeric:tabular-nums;margin:10px 0 0;color:var(--accent)}
.hero .unit{font-family:"Gowun Batang",serif;font-size:18px;margin-top:8px}
.hero .sub{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.7}

.sectitle{font-size:12px;color:var(--muted);padding:26px 0 8px;border-bottom:1px solid var(--rule)}
.nqbtn{flex:0 0 auto;background:none;border:1px solid var(--accent);color:var(--accent);border-radius:999px;
  padding:7px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer}
.nqbtn:active{background:var(--accent);color:var(--surface)}
.relnote{font-size:12.5px!important;color:var(--muted)!important;margin-top:10px!important}
.areahdr{font-size:13px;font-weight:700;color:var(--accent);padding:22px 0 4px}
.row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;
  border-bottom:1px solid var(--rule);padding:15px 2px;text-align:left;min-height:58px}
.row:hover .rname{color:var(--accent)}
.rname{font-size:15px;font-weight:500;display:block}
.rsub{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.rnum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rpct{width:52px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.rpct.has{color:var(--ink);font-weight:600}
.bar{height:2px;background:var(--shade);margin-top:7px;width:100%;display:block}
.bar > i{display:block;height:100%;background:var(--accent)}
.del{border:0;background:none;color:var(--muted);font-size:13px;padding:8px}

.actions{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.btn{display:block;width:100%;padding:17px 18px;border:1px solid var(--accent);
  background:var(--accent);color:var(--bg);border-radius:2px;font-weight:600;font-size:15px;text-align:center}
.btn.ghost{background:none;color:var(--accent)}
.btn.quiet{background:none;border-color:var(--rule);color:var(--muted);font-weight:400}
.btn[disabled]{opacity:.4;pointer-events:none}
.note{font-size:12.5px;color:var(--muted);margin-top:22px;line-height:1.75}
.note code{background:var(--shade);padding:1px 5px;border-radius:2px;font-size:12px}

.empty{padding:56px 0 8px;border-top:1px solid var(--rule);margin-top:8px}
.empty h2{font-family:"Gowun Batang",serif;font-size:22px;margin:0 0 12px;font-weight:700}
.empty p{color:var(--muted);font-size:14px;margin:0;line-height:1.75}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;
  position:sticky;top:0;background:var(--bg);z-index:5}
.back{background:none;border:0;padding:6px 8px 6px 0;color:var(--muted);font-size:14px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{height:2px;background:var(--shade);position:sticky;top:52px;z-index:5}
.pbar > i{display:block;height:100%;background:var(--accent);transition:width .25s ease}

.tag{font-size:12px;color:var(--muted);margin:28px 0 12px}
.stem{font-family:"Gowun Batang",serif;font-size:20px;line-height:1.62;font-weight:700;
  margin:0 0 26px;word-break:keep-all;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px}
.psg{font-size:15px;line-height:1.78;background:var(--surface);border:1px solid var(--rule);border-radius:2px;
  padding:14px 16px;margin:0 0 18px;word-break:keep-all}
.psg p{margin:0 0 8px} .psg p:last-child{margin-bottom:0} .psg h3,.psg h4{margin:4px 0 8px;font-size:15px}
.tbw{overflow-x:auto;margin:8px 0 12px;-webkit-overflow-scrolling:touch}
.mdt{border-collapse:collapse;font-size:13.5px;min-width:100%;font-variant-numeric:tabular-nums}
.mdt th,.mdt td{border:1px solid var(--rule);padding:6px 9px;text-align:center;white-space:nowrap}
.mdt th{background:var(--shade);font-weight:600}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;padding:14px 15px;min-height:58px;
  background:var(--surface);border:1px solid var(--rule);border-radius:2px;text-align:left;
  line-height:1.55;word-break:keep-all;transition:border-color .15s ease, background .15s ease}
.opt:hover{border-color:var(--accent)}
.opt .mark{font-variant-numeric:tabular-nums;color:var(--muted);flex:none;font-size:14px;padding-top:1px}
.opt.picked-ok{background:var(--okbg);border-color:var(--ok)}
.opt.picked-ok .mark{color:var(--ok)}
.opt.picked-no{background:var(--nobg);border-color:var(--no)}
.opt.picked-no .mark{color:var(--no)}
.opt.reveal{border-color:var(--ok)}
.opt.reveal .mark{color:var(--ok)}
.opt.dim{opacity:.5}
.opts.done .opt{pointer-events:none}

.verdict{margin:24px 0 0;padding-top:20px;border-top:1px solid var(--rule)}
.verdict h4{margin:0 0 8px;font-size:14px;font-weight:600}
.verdict h4.o{color:var(--ok)}
.verdict h4.x{color:var(--no)}
.verdict p{margin:0;font-size:14.5px;line-height:1.72;word-break:keep-all;white-space:pre-wrap}

.calcbtn{background:none;border:1px solid var(--rule);border-radius:2px;color:var(--muted);
  font-size:12.5px;padding:5px 10px;margin-left:8px}
.calcbtn.on{border-color:var(--accent);color:var(--accent)}
#calc{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--rule);padding:12px 20px}
#calc .inner{max-width:620px;margin:0 auto}
#calc .disp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:24px;text-align:right;
  padding:10px 12px;background:var(--bg);border:1px solid var(--rule);border-radius:2px;
  overflow-x:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
#calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
#calc .keys button{min-height:46px;font-size:17px;background:var(--bg);border:1px solid var(--rule);
  border-radius:2px;color:var(--ink);font-variant-numeric:tabular-nums}
#calc .keys button.op{color:var(--accent);font-weight:600}
#calc .keys button.eq{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.dock{flex:0 0 auto;background:var(--bg);border-top:1px solid var(--rule);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.dock .inner{max-width:620px;margin:0 auto;display:flex;gap:10px}
.dock .inner .btn{flex:1}
.fcard{perspective:1200px;margin:22px 0 8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fcard .in{position:relative;height:min(58vh,440px);transition:transform .45s ease;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.fcard.flip .in{transform:rotateY(180deg)}
.fcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:26px 22px;
  display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.fcard .front{align-items:center;text-align:center}
.fcard .front .term{font-family:"Gowun Batang",serif;font-size:27px;font-weight:700;line-height:1.45;word-break:keep-all}
.fcard .back{transform:rotateY(180deg);justify-content:flex-start}
.fcard .back .bterm{font-family:"Gowun Batang",serif;font-size:18px;font-weight:700;color:var(--accent);margin:0 0 14px;word-break:keep-all}
.fcard .back .def{font-size:16px;line-height:1.85;word-break:keep-all;white-space:pre-wrap}
.fcard .hint{font-size:12px;color:var(--muted);margin-top:18px}
.cmark{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px}
.cmark.k{color:var(--ok)} .cmark.u{color:var(--no)}
@media (prefers-reduced-motion: reduce){.fcard .in{transition:none}}
.mrow{display:flex;align-items:center;gap:10px}
.menubtn{background:none;border:1px solid var(--rule);border-radius:3px;font-size:17px;line-height:1;padding:8px 10px;color:var(--ink)}
#drawer{position:fixed;inset:0;z-index:60;pointer-events:none}
#drawer .dim{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .2s ease}
#drawer .panel{position:absolute;top:0;bottom:0;left:0;width:min(80vw,300px);background:var(--bg);border-right:1px solid var(--rule);
  padding:calc(26px + env(safe-area-inset-top)) 18px 20px;overflow-y:auto;transform:translateX(-102%);transition:transform .22s ease}
#drawer.open{pointer-events:auto}
#drawer.open .dim{opacity:1}
#drawer.open .panel{transform:translateX(0)}
#drawer h3{font-family:"Gowun Batang",serif;font-size:20px;margin:0 0 12px}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:15px 4px;font-size:15.5px;color:var(--ink)}
.mi.on{color:var(--accent);font-weight:600}
.mi small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.calhead h2{font-family:"Gowun Batang",serif;font-size:21px;margin:0}
.calhead .nav{display:flex;gap:6px}
.calhead .nav button{background:none;border:1px solid var(--rule);border-radius:3px;padding:7px 11px;color:var(--ink);font-size:14px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.cgrid .wd{font-size:11.5px;color:var(--muted);text-align:center;padding:6px 0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.cgrid .wd.sun,.cgrid .dn.sun{color:var(--no)}
.cell{min-height:74px;padding:4px 3px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:none;border-top:0;border-left:0;
  text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink);min-width:0}
.cell.out{opacity:.35}
.cell.sel{background:var(--shade)}
.cell .dn{font-size:12px;font-variant-numeric:tabular-nums;padding:1px 3px;align-self:flex-start;border-radius:10px}
.cell.today .dn{background:var(--accent);color:var(--bg)}
.chip{font-size:10.5px;line-height:1.35;padding:1px 3px;border-left:2.5px solid;background:var(--surface);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
.chip.locked{opacity:.45;border-left-style:dashed}
.c-doc{border-color:var(--c-doc);color:var(--c-doc)} .c-test{border-color:var(--c-test);color:var(--c-test)}
.c-int{border-color:var(--c-int);color:var(--c-int)} .c-ann{border-color:var(--c-ann);color:var(--c-ann)} .c-per{border-color:var(--c-per);color:var(--c-per)}
.more{font-size:10px;color:var(--muted);padding-left:3px}
.evrow{display:flex;gap:10px;padding:12px 2px;border-bottom:1px solid var(--rule);align-items:flex-start}
.evrow .bar{flex:none;width:3px;align-self:stretch;border-radius:2px}
.evrow .bar.c-doc{background:var(--c-doc)} .evrow .bar.c-test{background:var(--c-test)} .evrow .bar.c-int{background:var(--c-int)} .evrow .bar.c-ann{background:var(--c-ann)} .evrow .bar.c-per{background:var(--c-per)}
.evrow .eo{font-size:14.5px;font-weight:600;word-break:keep-all}
.evrow .el{font-size:13px;color:var(--muted);margin-top:2px;word-break:keep-all}
.tgl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:12px 0 0;background:none;border:0;padding:6px 0}
.tgl .box{width:17px;height:17px;border:1.5px solid var(--muted);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--bg)}
.tgl.on .box{background:var(--accent);border-color:var(--accent)}
.cntbar{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:16px -20px 12px;padding:0 20px}
.cntbar::-webkit-scrollbar{display:none}
.cntbar button{flex:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:18px;
  padding:8px 14px;font-size:13.5px;white-space:nowrap;min-height:38px}
.cntbar button.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.cntlab{font-size:12.5px;color:var(--muted);margin:16px 0 0}
.segbar{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -20px;padding:10px 20px 10px;
  display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.segbar::-webkit-scrollbar{display:none}
.segbar button{flex:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:18px;
  padding:8px 13px;font-size:13.5px;white-space:nowrap;min-height:38px}
.segbar button b{font-weight:600;margin-left:4px;color:var(--muted);font-variant-numeric:tabular-nums}
.segbar button.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.segbar button.on b{color:var(--bg);opacity:.85}
.job .nx{font-size:12.5px;color:var(--accent);margin-top:6px}
.job{border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:16px 16px 6px;margin:12px 0}
.job .jt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.job .jo{font-size:16px;font-weight:600;word-break:keep-all}
.job .jr{font-size:12.5px;color:var(--muted);margin-top:2px;word-break:keep-all}
.badge{flex:none;font-size:11.5px;padding:3px 8px;border-radius:12px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.badge.cur{border-color:var(--accent);color:var(--accent)} .badge.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg)} .badge.no{border-color:var(--no);color:var(--no)}
.stg{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--rule);font-size:13.5px;align-items:baseline}
.stg:first-of-type{margin-top:10px}
.stg .sd{flex:none;width:86px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.stg .sn{flex:1;word-break:keep-all}
.stg .sr{flex:none;font-size:12.5px}
.stg.locked{opacity:.45}
.stg .sr.pass{color:var(--ok)} .stg .sr.fail{color:var(--no)}
.job a{display:inline-block;font-size:12.5px;color:var(--accent);margin:4px 0 10px}
.calinfo{font-size:13px;color:var(--muted);line-height:1.8;margin:14px 0;word-break:keep-all}
.calinfo code{background:var(--shade);padding:1px 5px;border-radius:2px;font-size:12px;word-break:break-all}
input.url{width:100%;padding:12px;border:1px solid var(--rule);border-radius:2px;background:var(--surface);color:var(--ink);font-size:13px}
.today{margin:26px 0 6px;border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:18px 18px 8px}
.today .td{font-size:12.5px;color:var(--muted)}
.today h2{font-family:"Gowun Batang",serif;font-size:21px;font-weight:700;margin:4px 0 4px;word-break:keep-all}
.today .tsum{font-size:13px;color:var(--muted);margin:0 0 10px}
.chk{display:flex;gap:11px;align-items:flex-start;width:100%;background:none;border:0;border-top:1px solid var(--rule);
  padding:12px 2px;text-align:left;font-size:14.5px;line-height:1.6;word-break:keep-all;color:var(--ink)}
.chk .box{flex:none;width:19px;height:19px;border:1.5px solid var(--muted);border-radius:3px;margin-top:2px;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--bg)}
.chk.on .box{background:var(--accent);border-color:var(--accent)}
.chk.on .txt{color:var(--muted);text-decoration:line-through}
.chk .tm{flex:none;font-size:12px;color:var(--muted);min-width:44px;margin-top:2px;font-variant-numeric:tabular-nums}
.warn{font-size:13.5px;background:var(--nobg);color:var(--no);padding:10px 12px;border-radius:2px;margin:6px 0 10px;line-height:1.6;word-break:keep-all}
.evt{display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid var(--rule);font-size:14px;align-items:baseline}
.evt .dd{flex:none;width:52px;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
.evt .ed{flex:none;width:64px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.evt .et{flex:1;word-break:keep-all}
.weekday{padding:14px 0 4px;border-bottom:1px solid var(--rule)}
.weekday .wh{font-size:13px;font-weight:600}
.weekday .wh span{color:var(--muted);font-weight:400;margin-left:6px}
.weekday ul{margin:6px 0 10px;padding-left:18px}
.weekday li{font-size:13.5px;line-height:1.7;color:var(--muted);word-break:keep-all}
.fxname{font-size:12.5px;color:var(--muted);margin:26px 0 10px}
.fx{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;font-family:"Gowun Batang",serif;
  font-size:21px;font-weight:700;line-height:1.5;margin:0 0 26px;word-break:keep-all}
.fx .seg{white-space:pre-wrap}
.slot{min-width:78px;min-height:44px;padding:6px 10px;border:1px dashed var(--rule);border-bottom:2px solid var(--muted);
  border-radius:2px;background:var(--surface);font-family:"IBM Plex Sans KR",sans-serif;font-size:15px;font-weight:500;
  color:var(--ink);display:inline-flex;align-items:center;justify-content:center;text-align:center;word-break:keep-all}
.slot.empty{color:var(--muted)}
.slot.cur{border-color:var(--accent);border-bottom-color:var(--accent);border-style:solid}
.slot.ok{background:var(--okbg);border:1px solid var(--ok)}
.slot.no{background:var(--nobg);border:1px solid var(--no)}
.tiles{display:flex;flex-wrap:wrap;gap:9px}
.tile{padding:11px 14px;min-height:46px;background:var(--surface);border:1px solid var(--rule);border-radius:2px;
  font-size:15px;color:var(--ink);word-break:keep-all}
.tile:hover{border-color:var(--accent)}
.tile.used{opacity:.28;pointer-events:none}
.fxans{font-family:"Gowun Batang",serif;font-size:17px;font-weight:700;color:var(--ok);margin:0 0 10px;word-break:keep-all}

.score{padding:48px 0 8px}
.score .num{font-family:"Gowun Batang",serif;font-size:78px;line-height:1;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--accent)}
.score .of{font-family:"Gowun Batang",serif;font-size:22px;color:var(--muted)}
.score .lab{font-size:13px;color:var(--muted);margin-top:14px}
.misslist{margin-top:26px;border-top:1px solid var(--rule)}
.miss{padding:14px 2px;border-bottom:1px solid var(--rule)}
.miss .mtag{font-size:12px;color:var(--muted)}
.miss .mq{font-family:"Gowun Batang",serif;font-size:15.5px;margin-top:5px;word-break:keep-all}

.note-body{padding:6px 0 20px}
.note-body h3{font-family:"Gowun Batang",serif;font-size:20px;font-weight:700;margin:30px 0 10px;word-break:keep-all}
.note-body h3:first-child{margin-top:8px}
.note-body h4{font-size:15px;font-weight:600;margin:22px 0 8px;color:var(--accent)}
.note-body p{margin:0 0 13px;line-height:1.85;word-break:keep-all}
.note-body ul{margin:0 0 14px;padding-left:19px}
.note-body li{margin-bottom:7px;line-height:1.8;word-break:keep-all}
.note-body .term{border-left:2px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 9px;
  font-size:14px;color:var(--muted);line-height:1.72;word-break:keep-all}
.note-body .term b{color:var(--ink);font-weight:600}
.note-body .call{background:var(--shade);padding:13px 15px;border-radius:2px;margin:0 0 15px;
  font-size:14.5px;line-height:1.8;word-break:keep-all}
.note-lead{font-size:13px;color:var(--muted);margin:0 0 4px}
.styletog{background:none;border:1px solid var(--rule);border-radius:2px;color:var(--muted);
  font-size:12.5px;padding:7px 12px;margin:4px 0 2px}
.styletog.on{border-color:var(--accent);color:var(--accent)}
textarea{width:100%;min-height:190px;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule);border-radius:2px;padding:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;line-height:1.6;resize:vertical}
.msg{font-size:13.5px;margin-top:14px;padding:12px 14px;border-radius:2px;line-height:1.6}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.no{background:var(--nobg);color:var(--no)}
.filebtn{display:block;width:100%;padding:17px 18px;border:1px solid var(--accent);background:none;
  color:var(--accent);border-radius:2px;font-weight:600;text-align:center}
input[type=file]{display:none}
.hidden{display:none}
/* 공준노트: 공고 찾기 · 내 공고 */
.fl{display:grid;gap:6px;margin:12px 0}
.fl>span{font-size:12px;color:var(--muted)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fc{border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:18px;padding:6px 12px;font-size:13px}
.fc.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.row2{display:flex;gap:8px;margin:0 0 12px}
.row2 .btn{flex:1;padding:11px 10px;text-align:center;text-decoration:none;font-size:14px}

.jctl button,.jctl select,.jctl input{font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:3px}
.jctl button.pass{border-color:var(--ok);color:var(--ok)} .jctl button.fail{border-color:var(--no);color:var(--no)}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted);margin:12px 0}
.form input{width:100%;padding:12px;border:1px solid var(--rule);border-radius:2px;background:var(--surface);color:var(--ink);font-size:14px}
.plan{border:1px solid var(--accent);border-radius:3px;padding:16px;margin:14px 0;line-height:1.8;font-size:14px}
.plan b{color:var(--accent)}
</style>

<body>
<div id="drawer"><div class="dim"></div><div class="panel">
  <h3>메뉴</h3>
  <button class="mi" data-go="home">공부<small>과목별 문제 · 정리 · 카드</small></button>
  <button class="mi" data-go="cal">캘린더<small>담은 공고 일정 월간 보기</small></button>
  <button class="mi" data-go="jobs">내 공고<small>전형 진행 상태 · 직접 입력</small></button>
  <button class="mi" data-go="find">공고 찾기<small>공공기관 채용공고 골라 담기</small></button>
  <button class="mi" data-go="backup">백업 · 설정<small>이 폰의 데이터 내보내기 · 불러오기</small></button>
</div></div>
<div id="shell">
  <div id="scroll"><div class="wrap" id="app"></div></div>
  <div id="calc" class="hidden"><div class="inner">
    <div class="disp" id="cdisp">0</div>
    <div class="keys">
      <button data-k="C">C</button><button data-k="DEL">←</button><button data-k="%" class="op">%</button><button data-k="/" class="op">÷</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="*" class="op">×</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="-" class="op">−</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="+" class="op">+</button>
      <button data-k="0">0</button><button data-k="000">000</button><button data-k=".">.</button><button data-k="=" class="eq">=</button>
    </div>
  </div></div>
  <div class="dock hidden" id="dock"><div class="inner"><button class="btn ghost hidden" id="dockbtn2"></button><button class="btn" id="dockbtn"></button></div></div>
</div>

<script>
/* ======================= 저장소 ======================= */
var PK="drill.packs.v1", SK="drill.stats.v1";
var packs=[], stats={}, updated=0, db=null, tmr=null;

// 예전 기관별 내장 꾸러미 id — 과목별로 재편하면서 은퇴
var RETIRED=["ksure-mgmt","kosaf-major","kosaf-ncs"];
function refreshBuiltin(){
  // 내장 꾸러미는 파일에 들어 있으므로 항상 최신으로 덮어쓴다.
  // 사용자가 직접 넣은 꾸러미만 저장소에서 유지한다.
  if(typeof BUILTIN==="undefined"||!BUILTIN.length) return;
  var ids={};
  var fresh=[];
  BUILTIN.forEach(function(raw){
    try{ var p=normalize(raw,null); p.builtin=true; ids[p.id]=1; fresh.push(p); }catch(e){}
  });
  var mine=packs.filter(function(x){ return !ids[x.id] && !x.builtin && RETIRED.indexOf(x.id)<0; });
  packs=fresh.concat(mine);
  writePacks();
  migrateRecords();
}
// 꾸러미 id가 바뀌어도 풀이 기록·카드·공식·회독 기록을 이어 쓴다 (문항 내용 해시가 같으면 같은 문항)
function migrateRecords(){
  function suffixMap(obj,sep){ var m={}; Object.keys(obj).forEach(function(k){ var i=k.lastIndexOf(sep); if(i>0){ var s=k.slice(i+1); if(!m[s]) m[s]=k; } }); return m; }
  var qm=suffixMap(stats,":"), cm=suffixMap(cstat,"~"), fm=suffixMap(fstat,"^"), moved=0;
  var rk={}; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf("reads:")===0){ var j=k.lastIndexOf("#"); if(j>0) rk[k.slice(j+1)]=k; } } }catch(e){}
  packs.forEach(function(p){
    p.questions.forEach(function(q){ if(stats[q.id]) return; var s=q.id.slice(q.id.lastIndexOf(":")+1); if(qm[s]&&qm[s]!==q.id){ stats[q.id]=stats[qm[s]]; moved++; } });
    (p.cards||[]).forEach(function(c){ if(c.id in cstat) return; var s=c.id.slice(c.id.lastIndexOf("~")+1); if(cm[s]!==undefined&&cm[s]!==c.id){ cstat[c.id]=cstat[cm[s]]; moved++; } });
    (p.formulas||[]).forEach(function(f){ if(fstat[f.id]) return; var s=f.id.slice(f.id.lastIndexOf("^")+1); if(fm[s]&&fm[s]!==f.id){ fstat[f.id]=fstat[fm[s]]; moved++; } });
    (p.notes||[]).forEach(function(n){ try{ if(localStorage.getItem("reads:"+n.id)) return; var s=n.id.slice(n.id.lastIndexOf("#")+1); if(rk[s]&&rk[s]!=="reads:"+n.id){ localStorage.setItem("reads:"+n.id, localStorage.getItem(rk[s])); moved++; } }catch(e){} });
  });
  if(moved){ writeStats(); try{ localStorage.setItem(CK,JSON.stringify(cstat)); localStorage.setItem(FK,JSON.stringify(fstat)); }catch(e){} }
}
function readLS(){
  try{ var p=localStorage.getItem(PK); if(p) packs=JSON.parse(p)||[]; }catch(e){packs=[];}
  try{ var s=localStorage.getItem(SK); if(s){var o=JSON.parse(s); stats=o.stats||{}; updated=o.updated||0;} }catch(e){}
}
function writePacks(){ try{localStorage.setItem(PK,JSON.stringify(packs));}catch(e){alert("저장 공간이 부족합니다. 사용하지 않는 꾸러미를 지워 주세요.");} }
function writeStats(){
  updated=Date.now();
  try{localStorage.setItem(SK,JSON.stringify({stats:stats,updated:updated}));}catch(e){}
  if(!db) return;
  clearTimeout(tmr);
  tmr=setTimeout(function(){
    try{ db.doc("progress/main").set({stats:stats,updated:updated}).catch(function(){}); }catch(e){}
  },900);
}
function syncPack(p){
  if(!db) return;
  try{ db.doc("packs/"+p.id).set({pack:p,at:Date.now()}).catch(function(){}); }catch(e){}
}
function initSync(){
  if(!window.claude||!claude.use) return;
  claude.use("db").then(function(d){
    if(!d) return; db=d;
    db.doc("progress/main").get().then(function(s){
      if(s&&s.exists){ var v=s.data();
        if(v&&v.stats&&(v.updated||0)>updated){ stats=v.stats; updated=v.updated;
          try{localStorage.setItem(SK,JSON.stringify({stats:stats,updated:updated}));}catch(e){}
          if(view==="shelf") shelf();
        } }
    }).catch(function(){});
    db.collection("packs").get().then(function(qs){
      var added=false;
      qs.docs.forEach(function(doc){
        var v=doc.data(); if(!v||!v.pack) return;
        if(!packs.some(function(p){return p.id===v.pack.id;})){ packs.push(v.pack); added=true; }
      });
      if(added){ writePacks(); if(view==="shelf") shelf(); }
    }).catch(function(){});
  }).catch(function(){});
}

/* ======================= 꾸러미 처리 ======================= */
function hash(s){
  var h=5381,i=0; for(;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}
  return (h>>>0).toString(36);
}
function normalize(raw,fallbackName){
  var meta={}, list=null;
  if(Array.isArray(raw)) list=raw;
  else if(raw&&Array.isArray(raw.questions)){ list=raw.questions; meta=raw; }
  else throw new Error("questions 배열을 찾을 수 없습니다.");

  var name=(meta.name||fallbackName||"이름 없는 꾸러미").toString().trim();
  var id=(meta.id||"p_"+hash(name)).toString().replace(/[^A-Za-z0-9_.~:@+-]/g,"_").slice(0,120);

  var qs=[];
  list.forEach(function(q,i){
    if(!q||typeof q.q!=="string") return;
    if(!Array.isArray(q.o)||q.o.length<2) return;
    var a=q.a;
    if(typeof a!=="number"||a<0||a>=q.o.length) return;
    qs.push({
      id:id+":"+hash(q.q),
      sub:(q.sub||meta.name||"전체").toString(),
      q:q.q, o:q.o.map(String), a:a, e:(q.e||"").toString(),
      nt:(q.t||"").toString()
    });
  });
  var hasOther=(Array.isArray(meta.notes)&&meta.notes.length)||(Array.isArray(meta.cards)&&meta.cards.length)||(Array.isArray(meta.formulas)&&meta.formulas.length);
  if(!qs.length&&!hasOther) throw new Error("유효한 문항이 없습니다. q, o, a 항목을 확인해 주세요.");

  var notes=[];
  if(Array.isArray(meta.notes)){
    meta.notes.forEach(function(n){
      if(!n||typeof n.title!=="string"||typeof n.body!=="string") return;
      var lk=[];
      if(Array.isArray(n.links)) n.links.forEach(function(l){
        if(l&&typeof l.url==="string"&&/^https?:\/\//.test(l.url)) lk.push({title:(l.title||l.url).toString(), url:l.url, note:(l.note||"").toString()});
      });
      notes.push({id:id+"#"+hash(n.title), title:n.title, sub:(n.sub||"").toString(), body:n.body, alt:(typeof n.alt==="string"?n.alt:null), links:lk});
    });
  }
  var cards=[];
  if(Array.isArray(meta.cards)){
    meta.cards.forEach(function(c){
      if(!c||typeof c.front!=="string"||typeof c.back!=="string") return;
      cards.push({id:id+"~"+hash(c.front+"|"+(c.sub||"")), sub:(c.sub||"기타").toString(), front:c.front, back:c.back});
    });
  }
  var fxs=[];
  if(Array.isArray(meta.formulas)){
    meta.formulas.forEach(function(f){
      if(!f||typeof f.template!=="string"||!Array.isArray(f.answer)||!Array.isArray(f.pool)) return;
      if(f.template.split("?").length-1!==f.answer.length) return;
      fxs.push({id:id+"^"+hash(f.template+"|"+(f.sub||"")), sub:(f.sub||"기타").toString(), name:(f.name||"").toString(),
        template:f.template, answer:f.answer.map(String), accept:Array.isArray(f.accept)?f.accept:[], pool:f.pool.map(String), e:(f.e||"").toString()});
    });
  }
  return {id:id,name:name,exam:meta.exam||null,note:meta.note||"",questions:qs,notes:notes,cards:cards,formulas:fxs};
}
function addPack(p){
  var at=-1;
  packs.forEach(function(x,i){ if(x.id===p.id) at=i; });
  if(at>=0) packs[at]=p; else packs.push(p);
  writePacks(); syncPack(p);
  return at>=0;
}

/* ======================= 통계 ======================= */
function st(id){ return stats[id]||{s:0,c:0,last:null}; }
function record(id,ok){
  var r=stats[id]||{s:0,c:0,last:null};
  r.s+=1; if(ok) r.c+=1; r.last=ok?"o":"x";
  stats[id]=r; writeStats();
}
function packStat(p){
  var seen=0,att=0,corr=0;
  p.questions.forEach(function(q){var r=st(q.id); if(r.s>0){seen++;att+=r.s;corr+=r.c;}});
  return {total:p.questions.length,seen:seen,pct:att?Math.round(corr/att*100):null};
}
function subStat(p,sub){
  var qs=p.questions.filter(function(q){return q.sub===sub;});
  var seen=0,att=0,corr=0;
  qs.forEach(function(q){var r=st(q.id); if(r.s>0){seen++;att+=r.s;corr+=r.c;}});
  return {total:qs.length,seen:seen,pct:att?Math.round(corr/att*100):null};
}
function subsOf(p){
  var out=[],seen={};
  p.questions.forEach(function(q){ if(!seen[q.sub]){seen[q.sub]=1;out.push(q.sub);} });
  (p.notes||[]).forEach(function(n){ if(n.sub&&!seen[n.sub]){seen[n.sub]=1;out.push(n.sub);} });
  (p.cards||[]).forEach(function(c){ if(c.sub&&!seen[c.sub]){seen[c.sub]=1;out.push(c.sub);} });
  (p.formulas||[]).forEach(function(f){ if(f.sub&&!seen[f.sub]){seen[f.sub]=1;out.push(f.sub);} });
  return out;
}
function fxOf(p,sub){ return (p.formulas||[]).filter(function(f){ return f.sub===sub; }); }
var FK="formula.v1", fstat={};
try{ fstat=JSON.parse(localStorage.getItem(FK)||"{}")||{}; }catch(e){ fstat={}; }
function frec(id,ok){ var r=fstat[id]||{s:0,c:0,last:null}; r.s++; if(ok) r.c++; r.last=ok?"o":"x"; fstat[id]=r; try{localStorage.setItem(FK,JSON.stringify(fstat));}catch(e){} }
function fwrong(id){ return fstat[id]&&fstat[id].last==="x"; }
function cardsOf(p,sub){ return (p.cards||[]).filter(function(c){ return c.sub===sub; }); }
var CK="cards.v1", cstat={};
try{ cstat=JSON.parse(localStorage.getItem(CK)||"{}")||{}; }catch(e){ cstat={}; }
function cmark(id,known){ cstat[id]=known?1:0; try{localStorage.setItem(CK,JSON.stringify(cstat));}catch(e){} }
function cknown(id){ return cstat[id]===1; }
function cunknown(id){ return cstat[id]===0; }
function notesOf(p,sub){
  return (p.notes||[]).filter(function(n){ return (n.sub||"")===sub; });
}
function qsOf(p,sub){
  return p.questions.filter(function(q){ return q.sub===sub; });
}
// 개념 정리와 연결된 문항 (문항의 t = 정리 제목)
function qsOfNote(p,n){
  return p.questions.filter(function(q){ return q.nt && q.nt===n.title && q.sub===(n.sub||q.sub); });
}
function linkedOf(p,sub){
  return qsOf(p,sub).filter(function(q){ return !!q.nt; });
}
var retNote=null;
function dday(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||""));
  if(!m) return null;
  var d=new Date(+m[1],+m[2]-1,+m[3]);
  var t=new Date(); t.setHours(0,0,0,0);
  return Math.max(0,Math.round((d-t)/86400000));
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pickDaily(p,n){
  var w=shuffle(p.questions.filter(function(q){return st(q.id).last==="x";}));
  var f=shuffle(p.questions.filter(function(q){return st(q.id).s===0;}));
  var r=shuffle(p.questions.filter(function(q){var x=st(q.id);return x.s>0&&x.last!=="x";}));
  return w.concat(f,r).slice(0,n);
}

/* ======================= 렌더 ======================= */
var app=document.getElementById("app"), dock=document.getElementById("dock"), dockbtn=document.getElementById("dockbtn"), dockbtn2=document.getElementById("dockbtn2");
var view="shelf", cur=null, curSub=null, session=[], idx=0, answered=false, hits=0, misses=[], curOrder=null;
var calcExpr="0", calcJust=false;
function calcRender(){ var d=document.getElementById("cdisp"); if(d) d.textContent=calcExpr; }
function calcKey(k){
  try{
    if(k==="C"){ calcExpr="0"; calcJust=false; }
    else if(k==="DEL"){ calcExpr=calcExpr.length>1?calcExpr.slice(0,-1):"0"; calcJust=false; }
    else if(k==="="){
      var e=calcExpr.replace(/%/g,"/100");
      if(!/^[0-9+\-*/().\s]+$/.test(e)) return;
      var v=Function('"use strict";return ('+e+')')();
      if(typeof v==="number"&&isFinite(v)){
        calcExpr=String(Math.round(v*1e8)/1e8); calcJust=true;
      }
    }
    else{
      if(calcJust){ if(/^[0-9.]$|^000$/.test(k)) calcExpr="0"; calcJust=false; }
      if(calcExpr==="0"&&/[0-9.]/.test(k)) calcExpr=(k==="000"?"0":k);
      else calcExpr+=k;
    }
  }catch(e){ calcExpr="0"; }
  calcRender();
}
var calcBound=false;
function calcBind(){
  if(calcBound) return;
  var ks=document.querySelectorAll("#calc .keys button");
  if(!ks.length) return;
  Array.prototype.forEach.call(ks,function(b){
    b.onclick=function(){ calcKey(b.getAttribute("data-k")); };
  });
  calcBound=true; calcRender();
}
function calcToggle(force){

function pISO(iso){ var p=String(iso).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function isPass(r){ return r==="pass"||r==="done"; }
function stageInfo(j){
  var ok=true, out=[];
  (j.stages||[]).forEach(function(st){ var r=st.result||"pending"; out.push({s:st,locked:!ok,r:r}); if(!isPass(r)) ok=false; });
  return out;
}
function jobStatus(j){
  if(j.status) return {t:j.status,c:""};
  var st=j.stages||[];
  for(var i=0;i<st.length;i++){ var r=st[i].result||"pending";
    if(r==="fail") return {t:(st[i].type||"")+" 불합격",c:"no"};
    if(!isPass(r)) return {t:(st[i].type||"")+" 진행 중",c:"cur"}; }
  return {t:"최종 합격",c:"ok"};
}
function tcls(t){ t=t||""; if(/어학|자격|오픽|OPIc|토익|TOEIC|개인|시험일/.test(t)) return "c-per"; if(/서류|접수|원서/.test(t)) return "c-doc"; if(/필기|인성|시험|실기|논술/.test(t)) return "c-test"; if(/면접/.test(t)) return "c-int"; return "c-ann"; }
function jobEvents(withLocked){
  var ev=[]; if(!CAL||!Array.isArray(CAL.jobs)) return ev;
  CAL.jobs.forEach(function(j){
    if(j.hidden) return;
    var nm=j.short||j.org||"";
    stageInfo(j).forEach(function(x){
      if(x.locked&&!withLocked) return;
      var st=x.s;
      if(st.date){
        var base={org:nm,full:j.org,type:st.type||"",locked:x.locked,place:st.place||"",note:st.note||"",r:x.r,per:false};
        spanPush(ev,base,st.date,st.end,(st.label||st.type||"")+(st.time?" "+st.time:""));
      }
      if(st.announce) ev.push({date:st.announce,org:nm,full:j.org,type:"발표",label:(st.type||"")+" 발표",locked:x.locked,place:"",note:"",r:x.r});
    });
  });
  ev.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
  return ev;
}

function spanPush(ev,base,d0,d1,label){
  var a=pISO(d0), b=pISO(d1||d0), days=Math.round((b-a)/86400000)+1;
  function put(dt,lb){ var o={}; for(var k in base) o[k]=base[k]; o.date=ymd(dt); o.label=lb; ev.push(o); }
  if(days>5){ put(a,label+" 시작"); put(b,label+" 끝"); return; }
  var c=new Date(a.getTime()), g=0;
  while(c<=b&&g<31){ put(c,label); c.setDate(c.getDate()+1); g++; }
}
function personalEvents(){
  var ev=[]; if(!CAL||!Array.isArray(CAL.events)) return ev;
  CAL.events.forEach(function(e){
    if(!e||!e.date) return;
    var base={org:e.short||e.title||"",full:e.title||"",type:e.type||"개인",locked:false,place:e.place||"",note:e.note||"",r:"pending",per:true};
    spanPush(ev,base,e.date,e.end,(e.label||e.type||"개인 일정")+(e.time?" "+e.time:""));
  });
  return ev;
}
function allEvents(withLocked){
  var ev=jobEvents(withLocked).concat(personalEvents());
  ev.sort(function(a,b){ if(a.date!==b.date) return a.date<b.date?-1:1; if(a.per!==b.per) return a.per?-1:1; return 0; });
  return ev;
}

      return '<button class="fc'+(ff.se.indexOf(s)>=0?' on':'')+'" data-fs="'+esc(s)+'">'+esc(s)+'</button>'; }).join("")+'</div></div>';

      return '<option'+(r===ff.rgn?' selected':'')+'>'+esc(r)+'</option>'; }).join("")+'</select></div>';

  Array.prototype.forEach.call(app.querySelectorAll("[data-fs]"),function(b){ b.onclick=function(){ toggle(ff.se,b.getAttribute("data-fs"),b); }; });

  document.getElementById("fq").oninput=function(){ var v=this.value; clearTimeout(fqTimer); fqTimer=setTimeout(function(){ ff.q=v.trim(); ffSave(); renderFindList(); },250); };

function addFromFeed(sn){
  if(slotsLeft()<=0){ upgradeView(); return; }
  var it=feedLive().filter(function(x){ return String(x.sn)===String(sn); })[0]; if(!it||inCal(it.sn)) return;
  CAL.jobs.push({ id:"alio-"+it.sn, src:"alio-"+it.sn, org:it.org, role:it.title, url:it.url||"",
    memo:[(it.hire||[]).join(", "),it.se,(it.rgn||[]).join(", ")].filter(Boolean).join(" · "),
    stages:[{type:"서류",label:"원서 마감",date:it.end,result:"pending",note:it.start?"접수 "+md(it.start)+"~":""}] });
  if(mySave()) renderFindList();
}

  list.forEach(function(j){

      '<input type="date" data-sd="'+esc(j.id)+'"><button data-sadd="'+esc(j.id)+'">단계 추가</button><button data-del="'+esc(j.id)+'">삭제</button></div>';
    h+=card.replace(/<\/div>$/, ctl+'</div>');

  Array.prototype.forEach.call(app.querySelectorAll("[data-sadd]"),function(b){ b.onclick=function(){
    var id=b.getAttribute("data-sadd"), j=find(id), d=app.querySelector('[data-sd="'+id+'"]').value, t=app.querySelector('[data-st="'+id+'"]').value;

  Array.prototype.forEach.call(app.querySelectorAll("[data-del]"),function(b){ b.onclick=function(){

var BK_SKIP=/^(gj\.feed\.cache|cal\.cache|alio\.cache)$/;
function backupView(){
  view="backup"; setDock(null); calcToggle(false); toTop();
  var h=topMenu("백업 · 설정")+
    '<p class="calinfo">공준노트의 모든 기록(담은 공고, 풀이 기록, 단어카드)은 <b>이 폰의 브라우저에만</b> 저장돼요. 서버로 보내지 않아요.<br>'+
    '폰을 바꾸거나 브라우저 기록을 지우면 사라지니 가끔 백업 파일을 저장해 두세요. 아이폰은 <b>홈 화면에 추가</b>해서 쓰면 기록이 더 안전하게 남아요.</p>'+
    '<div class="actions"><button class="btn" id="bk-out">백업 파일 저장</button></div>'+
    '<div class="actions" style="margin-top:10px"><label class="filebtn" for="bk-in">백업 파일 불러오기</label><input type="file" id="bk-in" accept=".json,application/json"></div>'+
    '<div class="sectitle">요금제</div><p class="calinfo">'+(isPro()?'프리미엄 사용 중':!LIMIT_ON?'무료 · 지금은 공고를 제한 없이 담을 수 있어요 (지금 '+CAL.jobs.length+'개)':'무료 · 캘린더에 공고 '+FREE_LIMIT+'개까지 (지금 '+CAL.jobs.length+'개)')+'</p>';
  app.innerHTML=h; bindMenu();
  document.getElementById("bk-out").onclick=function(){
    var data={}; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(!BK_SKIP.test(k)) data[k]=localStorage.getItem(k); }
    var blob=new Blob([JSON.stringify({app:"gongjun-note",v:1,at:new Date().toISOString(),data:data})],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="공준노트-백업-"+ymd(new Date())+".json";
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  };
  document.getElementById("bk-in").onchange=function(){
    var f=this.files&&this.files[0]; if(!f) return;
    var rd=new FileReader(); rd.onload=function(){
      try{ var j=JSON.parse(rd.result); if(!j||j.app!=="gongjun-note"||!j.data) throw new Error("공준노트 백업 파일이 아니에요.");
        if(!confirm("백업 파일로 지금 기록을 덮어쓸까요?")) return;
        Object.keys(j.data).forEach(function(k){ if(k!=="gj.pro") localStorage.setItem(k,j.data[k]); });
        location.reload();
      }catch(e){ alert(e.message||"파일을 읽지 못했어요."); }
    }; rd.readAsText(f);
  };
}

function upcomingHTML(){
  var today=ymd(new Date()), seen={};
  var ev=allEvents(false).filter(function(e){ return e.date>=today; }).map(function(e){ return {date:e.date,title:e.org+" · "+e.label}; })
    .filter(function(e){ var k=e.date+e.title; if(seen[k]) return false; seen[k]=1; return true; }).slice(0,6);
  var h='<div class="sectitle">다가오는 일정</div>';
  if(!ev.length) return h+'<p class="note" style="margin-top:12px">아직 담은 공고가 없어요. 관심 있는 공고를 담으면 마감일이 여기와 캘린더에 뜹니다.</p>'+
    '<div class="actions" style="margin-top:10px"><button class="btn ghost" id="gofind2">공고 찾으러 가기</button></div>';
  ev.forEach(function(e){ var n=dayDiff(e.date);
    h+='<div class="evt"><span class="dd">'+(n===0?'D-DAY':'D-'+n)+'</span><span class="ed">'+(+e.date.split("-")[1])+'.'+(+e.date.split("-")[2])+'</span><span class="et">'+esc(e.title)+'</span></div>'; });
  return h;
}
function schedHTML(){
  var S=window.SCHEDULE; if(!S) return upcomingHTML();
  var today=ymd(new Date());
  var day=null; (S.days||[]).forEach(function(d){ if(d.date===today) day=d; });
  var h='<div class="today"><div class="td">오늘 · '+korDate(today)+'</div>';
  if(day){
    h+='<h2>'+esc(day.title)+'</h2>'+(day.sum?'<p class="tsum">'+esc(day.sum)+'</p>':'');
    (day.warn||[]).forEach(function(w){ h+='<div class="warn">'+esc(w)+'</div>'; });
    (day.items||[]).forEach(function(it,i){
      var k=day.date+"#"+i, on=!!sdone[k];
      h+='<button class="chk'+(on?' on':'')+'" data-chk="'+k+'"><span class="box">'+(on?'✓':'')+'</span>'+
         (it.t?'<span class="tm">'+esc(it.t)+'</span>':'')+'<span class="txt">'+esc(it.x)+'</span></button>';
    });
  }else{
    var nxt=null; (S.days||[]).forEach(function(d){ if(!nxt&&d.date>today) nxt=d; });
    h+='<h2>오늘은 정해둔 계획이 없습니다</h2>'+(nxt?'<p class="tsum">다음 계획: '+korDate(nxt.date)+' · '+esc(nxt.title)+'</p>':'');
  }
  h+='</div>';
  var ev;
  if(CAL&&Array.isArray(CAL.jobs)){ ev=allEvents(false).filter(function(e){ return e.date>=today; }).map(function(e){ return {date:e.date,title:e.org+" · "+e.label}; });
    var seen={}; ev=ev.filter(function(e){ var k=e.date+e.title; if(seen[k]) return false; seen[k]=1; return true; }); }
  else ev=(S.events||[]).filter(function(e){ return e.date>=today; });
  ev=ev.slice(0,6);
  if(ev.length){
    h+='<div class="sectitle">다가오는 일정</div>';
    ev.forEach(function(e){
      var n=dayDiff(e.date);
      h+='<div class="evt"><span class="dd">'+(n===0?'D-DAY':'D-'+n)+'</span><span class="ed">'+(+e.date.split("-")[1])+'.'+(+e.date.split("-")[2])+'</span><span class="et">'+esc(e.title)+'</span></div>';
    });
  }
  h+='<div class="actions" style="margin-top:14px"><button class="btn quiet" id="wk">주간 계획 전체 보기</button></div>';
  return h;
}

/* 과목 분류: NCS / 전공 / 자격증·어학 */
var PACK_CAT={ "ncs":"NCS", "mgmt":"전공", "econ":"전공", "law":"전공", "insfx":"전공",
  "jcg-ict":"자격증·어학", "tuja-unyongsa":"자격증·어학", "comphwal-1-pil":"자격증·어학", "comphwal-1-sil":"자격증·어학", "opic":"자격증·어학", "kor-history":"자격증·어학" };
var PACK_CAT_ORDER=["NCS","전공","자격증·어학","내가 추가한 꾸러미"];
function packCat(p){ return PACK_CAT[p.id]||p.cat||"내가 추가한 꾸러미"; }
function shelf(){
  view="shelf"; calcToggle(false); cur=null; setDock(null); toTop();
  var h='<div class="masthead"><div class="mrow"><button class="menubtn" id="mnu" aria-label="메뉴">☰</button><h1>공준노트</h1></div><p>공부 · 캘린더 · 공고를 한곳에서</p></div>'+schedHTML();
  if(!packs.length){
    if(window.PACKS_LOADING) h+='<div class="empty"><h2>과목을 불러오는 중…</h2><p>처음 한 번만 조금 걸려요.</p></div>';
    else h+='<div class="empty"><h2>아직 꾸러미가 없습니다</h2>'+
       '<p>JSON 파일을 불러오면 여기에 쌓입니다. 시험별로 하나씩 두고 필요할 때 골라 푸세요.</p></div>';
  }else{

function importView(){
  view="import"; setDock(null); toTop();
  app.innerHTML=
    '<div class="topbar"><button class="back" id="bk">← 보관함</button></div>'+
    '<div class="masthead" style="padding-top:12px"><h1>꾸러미 추가</h1>'+
    '<p>JSON 파일을 고르거나 내용을 그대로 붙여 넣으세요</p></div>'+
    '<div class="actions" style="margin-top:26px">'+
      '<label class="filebtn" for="fp">파일에서 불러오기</label>'+
      '<input type="file" id="fp" accept=".json,application/json,text/plain" multiple>'+
    '</div>'+
    '<div class="sectitle" style="margin-top:8px">붙여넣기</div>'+
    '<textarea id="ta" placeholder="여기에 JSON을 붙여 넣으세요" spellcheck="false"></textarea>'+
    '<div class="actions" style="margin-top:12px"><button class="btn ghost" id="paste">붙여넣은 내용 추가</button></div>'+
    '<div id="msg"></div>'+
    '<p class="note">형식은 <code>{"name":"...","questions":[{"sub":"...","q":"...","o":["","","",""],"a":0,"e":"..."}]}</code> 입니다. '+
    '<code>a</code>는 정답 선택지의 번호이며 0부터 셉니다. <code>exam</code>에 <code>"2026-10-18"</code>처럼 날짜를 넣으면 남은 일수가 표시됩니다. '+
    '같은 <code>id</code>로 다시 넣으면 덮어씁니다.</p>';
  document.getElementById("bk").onclick=shelf;

  function report(results){
    var okList=results.filter(function(r){return r.ok;});
    var bad=results.filter(function(r){return !r.ok;});
    var h="";
    if(okList.length) h+='<div class="msg ok">'+okList.map(function(r){return esc(r.name)+" · "+r.n+"문항 "+(r.replaced?"교체됨":"추가됨");}).join("<br>")+'</div>';
    if(bad.length) h+='<div class="msg no">'+bad.map(function(r){return esc(r.name)+" · "+esc(r.err);}).join("<br>")+'</div>';
    document.getElementById("msg").innerHTML=h;
    if(okList.length) setDock("보관함으로",shelf);
  }
  function take(text,fname){
    try{
      var p=normalize(JSON.parse(text),fname);
      var replaced=addPack(p);
      return {ok:true,name:p.name,n:p.questions.length,replaced:replaced};
    }catch(e){
      return {ok:false,name:fname||"붙여넣은 내용",err:e.message||"형식을 읽을 수 없습니다."};
    }
  }
  document.getElementById("fp").onchange=function(ev){
    var files=Array.prototype.slice.call(ev.target.files||[]);
    if(!files.length) return;
    var out=[],done=0;
    files.forEach(function(f){
      var rd=new FileReader();
      rd.onload=function(){ out.push(take(String(rd.result),f.name.replace(/\.json$/i,""))); if(++done===files.length) report(out); };
      rd.onerror=function(){ out.push({ok:false,name:f.name,err:"파일을 읽지 못했습니다."}); if(++done===files.length) report(out); };
      rd.readAsText(f,"utf-8");
    });
  };
  document.getElementById("paste").onclick=function(){
    var t=document.getElementById("ta").value.trim();
    if(!t){ document.getElementById("msg").innerHTML='<div class="msg no">붙여 넣은 내용이 없습니다.</div>'; return; }
    report([take(t,null)]);
  };
}

var fdeck=[], fidx=0, fhits=0, fslots=[], fdone=false, ftiles=[], frev=false;
function startFx(sub,list){
  if(!list.length){ openSubject(sub); return; }
  curSub=sub; fdeck=list; fidx=0; fhits=0; renderFx();
}
function fxOk(f,arr){
  function eq(a,b){ if(a.length!==b.length) return false; for(var i=0;i<a.length;i++){ if(a[i]!==b[i]) return false; } return true; }
  if(eq(arr,f.answer)) return true;
  for(var k=0;k<f.accept.length;k++){ if(eq(arr,f.accept[k])) return true; }
  return false;
}
function renderFx(){
  view="fx"; calcToggle(false); toTop();
  var f=fdeck[fidx]; fdone=false; frev=false;
  fslots=f.answer.map(function(){ return null; });
  ftiles=shuffle(f.pool.map(function(t,i){ return {t:t,i:i}; }));
  drawFx();
}
function drawFx(){
  var f=fdeck[fidx];
  var segs=f.template.split("?");
  var curI=fslots.indexOf(null);
  var used={}; fslots.forEach(function(v){ if(v!==null) used[v]=1; });
  var okAll=false, filled=(curI===-1);
  var h='<div class="topbar"><button class="back" id="bk">← '+esc(curSub)+'</button>'+
        '<span class="count">'+(fidx+1)+' / '+fdeck.length+'</span></div>'+
        '<div class="pbar"><i style="width:'+Math.round(fidx/fdeck.length*100)+'%"></i></div>'+
        (f.name?'<p class="fxname">'+esc(f.name)+'</p>':'<p class="fxname">빈칸을 순서대로 채우세요</p>')+
        '<div class="fx">';
  var arr=fslots.map(function(v){ return v===null?null:f.pool[v]; });
  if(fdone) okAll=fxOk(f,arr)&&!frev;
  segs.forEach(function(sg,i){
    if(sg) h+='<span class="seg">'+esc(sg)+'</span>';
    if(i<segs.length-1){
      var v=fslots[i], cls="slot";
      if(v===null) cls+=" empty"+(i===curI&&!fdone?" cur":"");
      if(fdone&&frev) cls+=" ok";
      else if(fdone&&!okAll) cls+=(arr[i]===f.answer[i]?" ok":" no");
      else if(fdone&&okAll) cls+=" ok";
      h+='<button class="'+cls+'" data-slot="'+i+'"'+(fdone?' disabled':'')+'>'+(v===null?'?':esc(f.pool[v]))+'</button>';
    }
  });
  h+='</div>';
  if(!fdone){
    h+='<div class="tiles">';
    ftiles.forEach(function(t){
      h+='<button class="tile'+(used[t.i]?' used':'')+'" data-tile="'+t.i+'">'+esc(t.t)+'</button>';
    });
    h+='</div>';
  }else{
    var ans=""; segs.forEach(function(sg,i){ ans+=sg; if(i<segs.length-1) ans+=f.answer[i]; });
    h+='<div class="verdict"><h4 class="'+(okAll?"o":"x")+'">'+(okAll?"정답입니다":(frev?"정답 확인 · 틀린 공식으로 기록됩니다":"오답입니다"))+'</h4>'+
       (okAll?'':'<p class="fxans">'+esc(ans)+'</p>')+
       (f.e?'<p>'+esc(f.e)+'</p>':'')+'</div>';
  }
  app.innerHTML=h;
  document.getElementById("bk").onclick=function(){ openSubject(curSub); };
  if(!fdone){
    Array.prototype.forEach.call(app.querySelectorAll("[data-tile]"),function(b){
      b.onclick=function(){
        var ti=parseInt(b.getAttribute("data-tile"),10), k=fslots.indexOf(null);
        if(k===-1) return;
        fslots[k]=ti;
        if(fslots.indexOf(null)===-1){
          var a=fslots.map(function(v){ return f.pool[v]; });
          fdone=true; var ok=fxOk(f,a); if(ok) fhits++; frec(f.id,ok);
        }
        drawFx();
      };
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-slot]"),function(b){
      b.onclick=function(){ var si=parseInt(b.getAttribute("data-slot"),10); if(fslots[si]!==null){ fslots[si]=null; drawFx(); } };
    });
    setDock("정답 보기",function(){
      fslots=f.answer.map(function(a){ for(var i=0;i<f.pool.length;i++){ if(f.pool[i]===a&&fslots.indexOf(i)===-1) return i; } return null; });
      fdone=true; frev=true; frec(f.id,false); drawFx();
    },"비우기",function(){ fslots=f.answer.map(function(){return null;}); drawFx(); });
  }else{
    var last=(fidx===fdeck.length-1);
    setDock(last?"결과 보기":"다음 공식",function(){ if(last) fxResult(); else { fidx++; renderFx(); } });
  }
}
function fxResult(){
  view="fxres"; setDock(null); toTop();
  var wrongN=fdeck.length-fhits;
  app.innerHTML='<div class="score"><span class="num">'+fhits+'</span><span class="of"> / '+fdeck.length+'</span>'+
    '<div class="lab">'+(wrongN?'틀린 공식 '+wrongN+'개는 과목 화면에서 다시 풀 수 있습니다':'전부 맞혔습니다')+'</div></div>'+
    '<div class="actions">'+
      (wrongN?'<button class="btn" id="again">틀린 공식만 다시</button>':'')+
      '<button class="btn '+(wrongN?'ghost':'')+'" id="back2">과목으로</button></div>';
  var ag=document.getElementById("again");
  if(ag) ag.onclick=function(){ startFx(curSub, shuffle(fxOf(cur,curSub).filter(function(x){return fwrong(x.id);}))); };
  document.getElementById("back2").onclick=function(){ openSubject(curSub); };
}

var cdeck=[], cidx=0, cknownN=0, cunknownN=0, cflip=false;
function startCards(sub,list){
  if(!list.length){ openSubject(sub); return; }
  curSub=sub; cdeck=list; cidx=0; cknownN=0; cunknownN=0; renderCard();
}
function renderCard(){
  view="card"; calcToggle(false); toTop();
  var c=cdeck[cidx]; cflip=false;
  var mk=(c.id in cstat)?(cknown(c.id)?'<p class="cmark k">지난번: 알아요</p>':'<p class="cmark u">지난번: 몰라요</p>'):'<p class="cmark">처음 보는 카드</p>';
  app.innerHTML='<div class="topbar"><button class="back" id="bk">← '+esc(curSub)+'</button>'+
    '<span class="count">'+(cidx+1)+' / '+cdeck.length+'</span></div>'+
    '<div class="pbar"><i style="width:'+Math.round(cidx/cdeck.length*100)+'%"></i></div>'+
    '<div class="fcard" id="fc"><div class="in">'+
      '<div class="face front"><div class="term">'+esc(c.front)+'</div><div class="hint">눌러서 뒤집기</div></div>'+
      '<div class="face back"><div class="bterm">'+esc(c.front)+'</div><div class="def">'+esc(c.back)+'</div></div>'+
    '</div></div>'+mk;
  document.getElementById("bk").onclick=function(){ openSubject(curSub); };
  var fc=document.getElementById("fc");
  fc.onclick=function(){ cflip=!cflip; if(cflip) fc.classList.add("flip"); else fc.classList.remove("flip"); };
  function go(known){
    cmark(c.id,known); if(known) cknownN++; else cunknownN++;
    if(cidx===cdeck.length-1) cardResult(); else { cidx++; renderCard(); }
  }
  setDock("알아요",function(){go(true);},"몰라요",function(){go(false);});
}

  view="cardres"; setDock(null); toTop();

}

function pickDailySub(qs,n){
  var w=shuffle(qs.filter(function(q){return st(q.id).last==="x";}));
  var f=shuffle(qs.filter(function(q){return st(q.id).s===0;}));
  var r=shuffle(qs.filter(function(q){var x=st(q.id);return x.s>0&&x.last!=="x";}));
  return w.concat(f,r).slice(0,n);
}

// "| a | b |" 줄들을 표로. 둘째 줄 "|---|---|" 는 머리글 구분선이라 건너뛴다.
function mdTable(rows){
  var h='<div class="tbw"><table class="mdt">', first=true;
  rows.forEach(function(r){
    if(/^\|[\s:|-]+\|?$/.test(r)) return;
    var cells=r.replace(/^\|/,"").replace(/\|$/,"").split("|"), tag=first?"th":"td";
    h+="<tr>"+cells.map(function(c){ return "<"+tag+">"+c.trim()+"</"+tag+">"; }).join("")+"</tr>";
    first=false;
  });
  return h+"</table></div>";
}
function mdNote(src){
  var out="", ul=false, tbl=[];
  esc(src).split("\n").forEach(function(ln){
    var t=ln.replace(/\s+$/,"");
    function closeUl(){ if(ul){ out+="</ul>"; ul=false; } }
    if(t.charAt(0)==="|"){ closeUl(); tbl.push(t); return; }
    if(tbl.length){ out+=mdTable(tbl); tbl=[]; }
    if(!t){ closeUl(); return; }
    if(t.indexOf("## ")===0){ closeUl(); out+="<h3>"+t.slice(3)+"</h3>"; }
    else if(t.indexOf("### ")===0){ closeUl(); out+="<h4>"+t.slice(4)+"</h4>"; }
    else if(t.indexOf("- ")===0){ if(!ul){out+="<ul>";ul=true;} out+="<li>"+t.slice(2)+"</li>"; }
    else if(t.indexOf("&gt; ")===0){ closeUl(); out+='<p class="call">'+t.slice(5)+"</p>"; }
    else if(t.indexOf("▸ ")===0){
      closeUl();
      var b=t.slice(2), k=b.indexOf(":");
      out+='<p class="term">'+(k>0?"<b>"+b.slice(0,k)+"</b>"+b.slice(k):b)+"</p>";
    }
    else { closeUl(); out+="<p>"+t+"</p>"; }
  });
  if(ul) out+="</ul>";
  if(tbl.length) out+=mdTable(tbl);
  return out.replace(/\*\*([^*]+?)\*\*/g,"<b>$1</b>");
}
// 문제 지문: 빈 줄로 나눠서 앞부분은 지문(표 가능), 마지막 문단은 질문
function stemHTML(text){
  var parts=String(text).split(/\n\s*\n/);
  if(parts.length<2) return '<p class="stem">'+esc(text)+'</p>';
  var ask=parts.pop();
  return '<div class="psg">'+mdNote(parts.join("\n\n"))+'</div><p class="stem">'+esc(ask)+'</p>';
}

function reads(id){
  try{ return parseInt(localStorage.getItem("reads:"+id)||"0",10)||0; }catch(e){ return 0; }
}
function bumpRead(id){
  try{ localStorage.setItem("reads:"+id, String(reads(id)+1)); }catch(e){}
}
function noteStyle(){
  try{ return localStorage.getItem("notestyle")==="casual"?"casual":"plain"; }catch(e){ return "plain"; }
}
function renderNote(sub,k){ calcToggle(false);
  if(!cur){shelf();return;}
  var list=notesOf(cur,sub); var n=list[k];
  if(!n){ openSubject(sub); return; }
  curSub=sub;
  view="note"; setDock(null); toTop();
  var rc=reads(n.id);
  var casual=(noteStyle()==="casual" && n.alt);
  var body=casual?n.alt:n.body;
  var h='<div class="topbar"><button class="back" id="bk">← '+esc(sub)+'</button>'+
      '<span class="count">'+(k+1)+' / '+list.length+(rc?' · '+rc+'회독':'')+'</span></div>'+
      (n.alt?'<button class="styletog'+(casual?" on":"")+'" id="tog">'+(casual?"편하게 읽는 중 · 정석으로 바꾸기":"정석으로 읽는 중 · 편하게 바꾸기")+'</button>':'')+
      '<div class="note-body">'+mdNote(body)+'</div>'+
      ((n.links&&n.links.length)?('<div class="sectitle">참고 강의</div>'+
        n.links.map(function(l){
          return '<a class="row" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit">'+
            '<span style="flex:1"><span class="rname">'+esc(l.title)+'</span>'+
            (l.note?'<span class="rsub">'+esc(l.note)+'</span>':'')+'</span>'+
            '<span class="rnum">열기 ↗</span></a>';
        }).join('')):'');
  var nq=qsOfNote(cur,n), nqw=nq.filter(function(q){return st(q.id).last==="x";}).length;
  if(nq.length){
    h+='<div class="sectitle">이 정리로 문제 풀기 · '+nq.length+'문항</div>'+
       '<div class="actions" style="margin-top:14px">'+
        '<button class="btn" id="nqa">이 정리 문제 풀기 ('+nq.length+')</button>'+
        (nqw?'<button class="btn ghost" id="nqw">틀린 것만 ('+nqw+')</button>':'')+
       '</div>';
  }
  app.innerHTML=h;
  document.getElementById("bk").onclick=function(){openSubject(sub);};
  var nqa=document.getElementById("nqa"); if(nqa) nqa.onclick=function(){ bumpRead(n.id); noteQuiz(sub,k,false); };
  var nqwb=document.getElementById("nqw"); if(nqwb) nqwb.onclick=function(){ noteQuiz(sub,k,true); };
  var tg=document.getElementById("tog");
  if(tg) tg.onclick=function(){
    try{ localStorage.setItem("notestyle", casual?"plain":"casual"); }catch(e){}
    renderNote(sub,k);
  };
  var last=(k===list.length-1);
  setDock(last?"다 읽음 · 목록으로":"다 읽음 · 다음 정리",function(){
    bumpRead(n.id);
    if(last) openSubject(sub); else renderNote(sub,k+1);
  });
}

function goBackFromQuiz(){ if(retNote) renderNote(retNote.sub,retNote.k); else if(curSub) openSubject(curSub); else openPack(cur.id); }
function noteQuiz(sub,k,wrongOnly){
  var n=notesOf(cur,sub)[k]; if(!n) return;
  var l=qsOfNote(cur,n); if(wrongOnly) l=l.filter(function(q){return st(q.id).last==="x";});
  if(!l.length) return;
  curSub=sub; var r={sub:sub,k:k}; start(shuffle(l.slice())); retNote=r;
}
function start(list){ retNote=null; if(!list.length){ goBackFromQuiz(); return; } session=list; idx=0; hits=0; misses=[]; renderQ(); }

function renderQ(){
  view="quiz"; toTop();
  var q=session[idx]; answered=false;
  var marks=["①","②","③","④","⑤","⑥"];
  var h='<div class="topbar"><button class="back" id="bk">← 나가기</button>'+
        '<span><span class="count">'+(idx+1)+' / '+session.length+'</span>'+
        '<button class="calcbtn" id="calcbtn">계산기</button></span></div>'+
        '<div class="pbar"><i style="width:'+Math.round(idx/session.length*100)+'%"></i></div>'+
        '<div class="tag">'+esc(q.sub)+'</div>'+
        stemHTML(q.q)+'<div class="opts" id="opts">';
  curOrder=shuffle(q.o.map(function(_,i){return i;}));
  curOrder.forEach(function(real,disp){
    h+='<button class="opt" data-i="'+disp+'"><span class="mark">'+(marks[disp]||(disp+1))+'</span><span>'+esc(q.o[real])+'</span></button>';
  });
  h+='</div><div id="vd"></div>';
  app.innerHTML=h; setDock(null);
  document.getElementById("bk").onclick=function(){ calcToggle(false); goBackFromQuiz(); };
  var cb=document.getElementById("calcbtn");
  if(cb){ if(!document.getElementById("calc").classList.contains("hidden")) cb.classList.add("on");
          cb.onclick=function(){ calcToggle(); }; }
  Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){
    b.onclick=function(){answer(parseInt(b.getAttribute("data-i"),10));};
  });
}

function answer(pick){
  if(answered) return; answered=true;
  var q=session[idx];
  var realPicked=(curOrder?curOrder[pick]:pick);
  var ok=(realPicked===q.a);
  var dispCorrect=(curOrder?curOrder.indexOf(q.a):q.a);
  if(ok) hits++; else misses.push(q);
  record(q.id,ok);
  var box=document.getElementById("opts"); box.classList.add("done");
  Array.prototype.forEach.call(box.querySelectorAll(".opt"),function(b){
    var i=parseInt(b.getAttribute("data-i"),10);
    if(i===pick) b.classList.add(ok?"picked-ok":"picked-no");
    else if(i===dispCorrect) b.classList.add("reveal");
    else b.classList.add("dim");
  });
  document.getElementById("vd").innerHTML=
    '<div class="verdict"><h4 class="'+(ok?"o":"x")+'">'+(ok?"정답입니다":"오답입니다 · 정답은 "+(["①","②","③","④","⑤","⑥"][dispCorrect]||(dispCorrect+1)))+'</h4>'+
    (q.e?'<p>'+esc(q.e)+'</p>':'')+
    (q.nt&&!retNote?'<p class="relnote">관련 정리 · '+esc(q.nt)+'</p>':'')+'</div>';
  var last=(idx===session.length-1);
  setDock(last?"결과 보기":"다음 문제",function(){ if(last) renderResult(); else {idx++;renderQ();} });
}

function renderResult(){ calcToggle(false);
  view="result"; setDock(null); toTop();
  var h='<div class="score"><span class="num">'+hits+'</span><span class="of"> / '+session.length+'</span>'+
    '<div class="lab">'+(misses.length?"틀린 문제는 과목 화면에서 다시 풀 수 있습니다":"전부 맞혔습니다")+'</div></div>';
  if(misses.length){
    h+='<div class="misslist">';
    misses.forEach(function(q){ h+='<div class="miss"><div class="mtag">'+esc(q.sub)+'</div><div class="mq">'+esc(q.q)+'</div></div>'; });
    h+='</div>';
  }
  h+='<div class="actions"><button class="btn" id="bk2">'+(retNote?'정리로 돌아가기':'돌아가기')+'</button></div>';
  app.innerHTML=h;
  document.getElementById("bk2").onclick=goBackFromQuiz;
}

// 과목 데이터: 기기에 저장된 것으로 먼저 그리고, 버전이 바뀌었을 때만 packs/*.json 을 새로 받는다
var PV="gj.packsVer";
function loadBuiltin(){
  fetch("packs/manifest.json?t="+Date.now()).then(function(r){ return r.json(); }).then(function(m){
    var have={}; packs.forEach(function(x){ if(x.builtin) have[x.id]=1; });
    var ver=null; try{ ver=localStorage.getItem(PV); }catch(e){}
    if(ver===m.version && m.ids.every(function(id){ return have[id]; })) return;
    if(!packs.length){ window.PACKS_LOADING=true; if(view==="shelf") shelf(); }
    return Promise.all(m.ids.map(function(id){
      return fetch("packs/"+id+".json?v="+encodeURIComponent(m.version)).then(function(r){ if(!r.ok) throw new Error(id); return r.json(); });
    })).then(function(arr){
      BUILTIN=arr; window.PACKS_LOADING=false; refreshBuiltin();
      try{ localStorage.setItem(PV,m.version); }catch(e){}
      if(view==="shelf") shelf();
    });
  }).catch(function(){ window.PACKS_LOADING=false; if(view==="shelf"&&!packs.length) shelf(); });
}
