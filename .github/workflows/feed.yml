name: 공고 목록 갱신

on:
  schedule:
    - cron: "0 21,3,9 * * *"   # 매일 06:00 · 12:00 · 18:00 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 진행 중 공고 받기
        env:
          ALIO_KEY: ${{ secrets.ALIO_KEY }}
        run: node scripts/feed.js
      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "공고 목록 자동 갱신"
          git push
